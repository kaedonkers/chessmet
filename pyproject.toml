[project]
name = "chessmet"
authors = [{name = "Kevin Donkers", email = "k.donkers@exeter.ac.uk"}]
requires-python = ">= 3.11"
version = "0.2.0"
dependencies = [
    "requests",
    "python-dotenv",
    "rich",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "mypy",
]

[project.scripts]
chessmet = "chessmet.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "chessmet.__version__"}

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Testing and Coverage Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = '-m "not live"'
markers = [
    "live: talks to the real EIDC server with your real token (opt in with: pytest -m live)",
]

[tool.coverage.run]
source = ["chessmet"]
omit = ["*/tests/*", "*/__main__.py"]

# ============================================================================
# Pixi Integration
# ============================================================================
# This section allows pixi to manage dependencies and environments
# See: https://pixi.sh/latest/python/pyproject_toml/
[tool.pixi.workspace]
channels = ["conda-forge", "apple"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]

[tool.pixi.pypi-dependencies]
chessmet = { path = ".", editable = true }

[tool.pixi.tasks]
chessmet = "chessmet"

[tool.pixi.environments]
default = { solve-group = "default" }
tests = { features = ["pytest"], solve-group = "default" }

[tool.pixi.feature.pytest.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
mypy = "*"

[tool.pixi.feature.pytest.tasks]
tests = "pytest tests"
